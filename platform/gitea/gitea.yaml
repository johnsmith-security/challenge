apiVersion: v1
kind: Namespace
metadata:
  name: gitea
---
# Minimal in-cluster Git server for the lab (stand-in for the client's GitHub/GitLab/Bitbucket).
# State is on emptyDir (the cluster has no StorageClass): bootstrap-platform.sh re-seeds the repos if it restarts.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea
  namespace: gitea
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: gitea }
  template:
    metadata:
      labels: { app: gitea }
    spec:
      containers:
        - name: gitea
          image: gitea/gitea:28.2-rootless
          env:
            - { name: GITEA__database__DB_TYPE, value: sqlite3 }
            - { name: GITEA__database__PATH, value: /var/lib/gitea/data/gitea.db }
            - { name: GITEA__security__INSTALL_LOCK, value: "true" }
            - { name: GITEA__service__DISABLE_REGISTRATION, value: "true" }
            - { name: GITEA__server__HTTP_PORT, value: "3000" }
            - { name: GITEA__server__ROOT_URL, value: "http://gitea-http.gitea.svc.cluster.local:3000/" }
            - { name: GITEA__server__DISABLE_SSH, value: "true" }
            - { name: GITEA__actions__ENABLED, value: "false" }
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet: { path: /api/healthz, port: 3000 }
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 384Mi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/gitea }
            - { name: conf, mountPath: /etc/gitea }
      volumes:
        - { name: data, emptyDir: {} }
        - { name: conf, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: gitea-http
  namespace: gitea
spec:
  type: NodePort
  selector: { app: gitea }
  ports:
    - { name: http, port: 3000, targetPort: 3000, nodePort: 30300 }
