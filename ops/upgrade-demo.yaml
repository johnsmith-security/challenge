# Sample workload for the upgrade test: 2 replicas, probed every second from outside the cluster.
apiVersion: v1
kind: Namespace
metadata:
  name: upgrade-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-demo
  namespace: upgrade-demo
spec:
  replicas: 2
  selector:
    matchLabels: { app: nginx-demo }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app: nginx-demo }
    spec:
      terminationGracePeriodSeconds: 30
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: { app: nginx-demo }
      containers:
        - name: nginx
          image: nginx:stable
          ports: [{ containerPort: 80 }]
          readinessProbe:
            httpGet: { path: /, port: 80 }
            periodSeconds: 1
          lifecycle:
            # keep serving while the Service/kube-proxy remove this endpoint
            preStop:
              exec: { command: ["sleep", "10"] }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: nginx-demo
  namespace: upgrade-demo
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: nginx-demo }
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-demo
  namespace: upgrade-demo
spec:
  type: NodePort
  selector: { app: nginx-demo }
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
